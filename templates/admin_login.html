<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 로그인</title>
<style>body{margin:0;background:#f5f6f8;font:15px system-ui,"Malgun Gothic",sans-serif;display:grid;place-items:center;min-height:100vh}
form{background:#fff;border:1px solid #e4e7ec;border-radius:12px;padding:28px;width:min(340px,92vw)}
h1{font-size:18px;margin:0 0 16px}input{width:100%;padding:10px;border:1px solid #cfd4dc;border-radius:8px;font:inherit;box-sizing:border-box}
button{width:100%;margin-top:12px;padding:11px;border:0;border-radius:8px;background:#c8102e;color:#fff;font-weight:700;font-size:15px}
.e{color:#b42318;margin-top:8px}</style></head>
<body><form method="post"><h1>근골격계 조사 관리자</h1>
<input type="password" name="password" placeholder="관리자 암호" autofocus>
<button>로그인</button>{% if error %}<div class="e">{{ error }}</div>{% endif %}</form></body></html>
